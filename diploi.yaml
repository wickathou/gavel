# This file is used to build the infrastructure for a deployment.
# After editing something here, apply the changes on the Diploi dashboard.
# For more information, see https://diploi.com/yaml

diploiVersion: v1.0
components:
  - hosts:
      - port: 8000
        endpoint: true
        name: App
        identifier: app
    name: Flask
    identifier: flask
    folder: /
    package: https://github.com/diploi/component-flask#v3.1.3
    containerCommands:
      productionStart: >-
        UV_PYTHON_PREFERENCE=only-system uv run --isolated --with-requirements requirements.txt python
        initialize.py && UV_PYTHON_PREFERENCE=only-system uv run --isolated --with-requirements requirements.txt
        gunicorn gavel:app -w 4 -b 0.0.0.0:8000
      developmentStart: >-
        UV_PYTHON_PREFERENCE=only-system uv run --isolated --with-requirements requirements.txt python
        initialize.py && UV_PYTHON_PREFERENCE=only-system uv run --isolated --with-requirements requirements.txt
        flask --app gavel:app run --host=0.0.0.0 --port=8000 --no-reload --debug
    env:
      include:
        - path: postgres.POSTGRES_HOST
          name: POSTGRES_HOST
        - path: postgres.POSTGRES_PORT
          name: POSTGRES_PORT
        - path: postgres.POSTGRES_USER
          name: POSTGRES_USER
        - path: postgres.POSTGRES_PASSWORD
          name: POSTGRES_PASSWORD
        - path: postgres.POSTGRES_DB
          name: POSTGRES_DB
        - path: redis.REDIS_URL
          name: BROKER_URI
        - value: 'true'
          name: IGNORE_CONFIG_FILE
        - value: 'true'
          name: DISABLE_EMAIL
        - value: _unused_
          name: EMAIL_FROM
        - value: _unused_
          name: EMAIL_USER
        - value: _unused_
          name: EMAIL_PASSWORD
        - value: admin
          name: ADMIN_USERNAME
        - value: 'true'
          name: PROXY
addons:
  - name: PostgreSQL
    identifier: postgres
    package: https://github.com/diploi/addon-postgres#v17.2
  - name: Redis
    identifier: redis
    package: https://github.com/diploi/addon-redis#main
